<div class="patients-page">
  <div class="page-header">
    <h1>Patients</h1>
    <button class="add-btn" (click)="openAddModal()" *ngIf="!isNurse">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
      </svg>
      Add Patient
    </button>
  </div>

  <app-view-patients (edit)="openEditModal($event)" (addAppointment)="openAppointmentModal($event)"></app-view-patients>
</div>

<div class="modal-overlay" *ngIf="showModal" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <app-patient-form 
      [patient]="selectedPatient"
      (close)="closeModal()"
      (saved)="onPatientSaved()">
    </app-patient-form>
  </div>
</div>

<div class="modal-overlay" *ngIf="showAppointmentModal" (click)="closeAppointmentModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <app-appointment-form 
      [patient]="selectedPatient"
      (close)="closeAppointmentModal()"
      (saved)="onAppointmentSaved()">
    </app-appointment-form>
  </div>
</div>
