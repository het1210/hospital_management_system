<div class="consultations-page">
  <div class="page-header">
    <h1>Consultations</h1>
  </div>

  <div class="filters-section">
    <!-- <div class="radio-options">
      <label class="radio-label">

      </label>
      <label class="radio-label">
        <input type="radio" name="searchType" value="doctor" [(ngModel)]="searchType" (change)="onSearchTypeChange()">
        <span>Doctor</span>
      </label>
    </div> -->

    <div class="filters-row">
      <div class="search-section">
        <div class="search-bar">
          <div class="form-group autocomplete-group">
            <div class="select-dropdown" [class.open]="showPatientDropdown">
              <div class="select-trigger" (click)="togglePatientDropdown()">
                <span class="selected-value">{{ patientSearchText || 'Search patient consultations...' }}</span>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="dropdown-icon">
                  <path d="M7 10l5 5 5-5z" />
                </svg>
              </div>
              <div class="dropdown-menu" *ngIf="showPatientDropdown">
                <div class="search-box">
                  <input type="text" [(ngModel)]="patientSearchText" [ngModelOptions]="{standalone: true}"
                    (input)="onSearchDropdown($event)" placeholder="Type patient name or adhaar..."
                    (click)="$event.stopPropagation()">
                </div>
                <div class="dropdown-items">
                  <div *ngFor="let patient of filteredPatients" class="dropdown-item" (click)="selectPatient(patient)">
                    {{ patient.displayText }}
                  </div>
                  <div *ngIf="filteredPatients.length === 0" class="no-results">
                    No patients found
                  </div>
                </div>
              </div>
            </div>
          </div>
          <button class="search-btn" (click)="onSearch()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
            </svg>
            Search
          </button>
        </div>
      </div>

      <!-- <div class="date-range-section">

        </div>

          Clear
        </button>
      </div> -->

  <app-view-consultations (view)="viewConsultation($event)" (print)="printConsultation($event)">
