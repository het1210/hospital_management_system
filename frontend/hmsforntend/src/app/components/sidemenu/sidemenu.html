<aside class="sidebar" [class.collapsed]="isCollapsed">
  <div class="sidebar-header">
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-1 11h-4v4h-4v-4H6v-4h4V6h4v4h4v4z"/>
      </svg>
      <span class="logo-text">HMS</span>
    </div>
    <button class="toggle-btn" (click)="toggleSidebar()">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
      </svg>
    </button>
  </div>

  <div class="user-info">
    <div class="user-avatar">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
      </svg>
    </div>
    <div class="user-details">
      <div class="user-name">{{ userName }}</div>
      <div class="role-selector">
        <select 
          [(ngModel)]="selectedRole" 
          (change)="onRoleChange()" 
          [disabled]="userRoles.length === 1"
          class="role-dropdown">
          <option *ngFor="let role of userRoles" [value]="role">
            {{ getRoleDisplayName(role) }}
          </option>
        </select>
      </div>
    </div>
  </div>

  <nav class="sidebar-nav">
    <a *ngFor="let item of menuItems" 
       [routerLink]="item.label === 'Logout' ? null : item.route"
       (click)="item.label === 'Logout' ? onLogout() : null"
       routerLinkActive="active"
       [routerLinkActiveOptions]="{exact: item.route === '/dashboard'}"
       class="nav-item"
       [class.logout]="item.label === 'Logout'">
      <span class="nav-icon" [attr.data-icon]="item.icon"></span>
      <span class="nav-label">{{ item.label }}</span>
    </a>
  </nav>
</aside>
