<div class="patients-table-container">
  <div class="search-bar">
    <input type="text" [(ngModel)]="searchQuery" (keyup.enter)="onSearch()"
      placeholder="Search by name, email or phone..." class="search-input">
    <button class="search-btn" (click)="onSearch()">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path
          d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
      </svg>
      Search
    </button>
    <button class="clear-btn" (click)="onClearSearch()" *ngIf="searchQuery">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path
          d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
      </svg>
      Clear
    </button>
  </div>

  <div class="loading" *ngIf="isLoading">
    <div class="spinner"></div>
    <p>Loading patients...</p>
  </div>

  <div *ngIf="!isLoading && patients.length === 0" class="no-data">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
      <path
        d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
    </svg>
    <p>No patients found</p>
  </div>

  <div class="table-wrapper" *ngIf="!isLoading && patients.length > 0">
    <table class="patients-table">
      <thead>
        <tr>
          <th>No.</th>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Gender</th>
          <th>Patient ID</th>
          <!-- <th>Blood Group</th>
          <th *ngIf="isSuperAdmin">Hospital</th> -->
          <!-- <th>Status</th> -->
          <th *ngIf="!isNurse">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let patient of patients; let i = index">
          <td>{{ i + 1 }}</td>
          <td class="patient-name">{{ patient.firstName }} {{ patient.lastName }}</td>
          <td>{{ patient.email }}</td>
          <td>{{ patient.phone }}</td>
          <td>{{ patient.gender }}</td>
          <td>{{ patient.patientIdentifier }}</td>
          <!-- <td>{{ patient.bloodGroup }}</td>
          <td *ngIf="isSuperAdmin">{{ patient.hospital?.name || 'N/A' }}</td> -->
          <!-- <td>
            <span class="status-badge" [class.active]="patient.status === 'ACTIVE'" [class.inactive]="patient.status !== 'ACTIVE'">
              {{ patient.status === 'ACTIVE' ? 'Active' : 'Inactive' }}
            </span>
          </td> -->
          <td class="actions" *ngIf="!isNurse">
            <button class="action-btn edit" title="Edit" (click)="editPatient(patient)">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" />
              </svg>
            </button>
            <!-- <button class="action-btn appointment" title="Book Appointment" (click)="bookAppointment(patient)">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/>
              </svg>
            </button> -->
            <button class="action-btn delete" title="Delete" (click)="deletePatient(patient.id!)">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" />
              </svg>
            </button>
            <button class="action-btn qr" title="Generate QR Code" (click)="generateQrCode(patient)">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M3 3h8v8H3V3zm2 2v4h4V5H5zm10-2h6v6h-6V3zm2 2v2h2V5h-2zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm12 2h2v2h-2v-2zm-2-4h2v2h-2v-2zm4 0h2v4h-2v-4zm-4 4h2v4h-2v-4z" />
              </svg>
            </button>

          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="pagination" *ngIf="!isLoading && patients.length > 0">
    <div class="page-size-selector">
      <label>Show:</label>
      <select [(ngModel)]="pageSize" (change)="onPageSizeChange()" class="size-dropdown">
        <option [value]="5">5</option>
        <option [value]="10">10</option>
        <option [value]="20">20</option>
        <option [value]="50">50</option>
      </select>
      <span>per page</span>
    </div>

    <div class="page-controls">
      <button class="page-btn" (click)="previousPage()" [disabled]="currentPage === 0">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" />
        </svg>
      </button>

      <button *ngFor="let page of pages" class="page-btn" [class.active]="page === currentPage"
        (click)="goToPage(page)">
        {{ page + 1 }}
      </button>

      <button class="page-btn" (click)="nextPage()" [disabled]="currentPage === totalPages - 1">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" />
        </svg>
      </button>
    </div>

    <span class="page-info">Total: {{ totalElements }} patients</span>
  </div>
</div>
